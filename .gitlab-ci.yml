stages:
  - validate
  - pages

validate_manual:
  stage: validate
  image: python:3.12-slim
  script:
    - python3 build.py --check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pages:
  stage: pages
  image: python:3.12-slim
  needs:
    - validate_manual
  script:
    - python3 build.py
    - test -f dist/index.html
    - test -f dist/en/index.html
    - test -f dist/versions/index.html
  artifacts:
    paths:
      - dist
  publish: dist
  environment:
    name: gitlab-pages
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

